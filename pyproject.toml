[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapmark-screenshot"
version = "0.1.2"
description = "A local-first Ubuntu screenshot and annotation utility"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6-Essentials>=6.8,<7", "Pillow>=11,<13", "dbus-next>=0.2.3,<1", "python-xlib>=0.33,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
snapmark = "cpp.main:main"
cpp-screenshot = "cpp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpp = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
